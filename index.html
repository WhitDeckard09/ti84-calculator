<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TI-84 Plus</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TI-84">
<meta name="description" content="A graphing calculator that works like a TI-84 Plus.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/calc.css">
</head>
<body class="booting">

<div class="calc" role="application" aria-label="TI-84 Plus graphing calculator">

  <div class="screen-bezel">
    <div id="lcd-host">
      <canvas id="lcd" width="384" height="256" aria-label="Calculator display"></canvas>
    </div>
  </div>

  <div class="brandbar">
    <span class="brand">TI-84 Plus</span>
    <span class="brand-sub">GRAPHING CALCULATOR</span>
  </div>

  <div class="keypad" id="keypad"></div>

</div>

<script src="js/font.js"></script>
<script src="js/lcd.js"></script>
<script src="js/math/tokens.js"></script>
<script src="js/math/parser.js"></script>
<script src="js/math/dec.js"></script>
<script src="js/math/matrix.js"></script>
<script src="js/math/evaluator.js"></script>
<script src="js/math/format.js"></script>
<script src="js/state.js"></script>
<script src="js/prgm.js"></script>
<script src="js/keypad.js"></script>
<script src="js/screens/menu.js"></script>
<script src="js/screens/home.js"></script>
<script src="js/screens/yequals.js"></script>
<script src="js/screens/fields.js"></script>
<script src="js/screens/settings.js"></script>
<script src="js/screens/graph.js"></script>
<script src="js/screens/table.js"></script>
<script src="js/screens/prgmedit.js"></script>
<script src="js/screens/matedit.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
